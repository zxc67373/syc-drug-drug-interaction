# ── SSRI × 抗血小板（消化道出血）────────────────────
- ing_a: 舍曲林
  ing_b: 阿司匹林
  severity: caution
  mechanism: SSRI 抑制血小板 5-HT 再摄取，损害血小板聚集功能，与抗血小板药协同
  consequence: 消化道出血风险显著增加
  suggestion: 联用时加用 PPI 保护胃黏膜，并评估出血风险
  evidence_level: B
  sources:
    - title: 盐酸舍曲林片说明书
      type: 说明书
      excerpt: 与 NSAIDs、阿司匹林或其他抗血小板药合用可增加消化道出血风险。

- ing_a: 氟西汀
  ing_b: 阿司匹林
  severity: caution
  mechanism: 同 SSRI 血小板机制
  consequence: 消化道出血风险增加
  suggestion: 加用 PPI 保护
  evidence_level: B

- ing_a: 帕罗西汀
  ing_b: 阿司匹林
  severity: caution
  mechanism: 同 SSRI 血小板机制
  consequence: 消化道出血风险增加
  suggestion: 加用 PPI 保护
  evidence_level: B

- ing_a: 舍曲林
  ing_b: 布洛芬
  severity: caution
  mechanism: SSRI 损害血小板功能 + NSAIDs 抑制血小板并损伤胃黏膜
  consequence: 消化道出血风险显著增加
  suggestion: 避免联用；必须使用时加 PPI 并缩短疗程
  evidence_level: B

- ing_a: 氟西汀
  ing_b: 布洛芬
  severity: caution
  mechanism: 同机制叠加
  consequence: 消化道出血风险
  suggestion: 加用 PPI 保护
  evidence_level: B

- ing_a: 舍曲林
  ing_b: 华法林
  severity: caution
  mechanism: SSRI 损害血小板功能，叠加抗凝作用
  consequence: 出血风险增加
  suggestion: 联用时加强 INR 与出血征象监测
