# ── NSAIDs × RAAS 阻断剂（"三重打击"）───────────────
- ing_a: 布洛芬
  ing_b: 卡托普利
  severity: caution
  mechanism: NSAIDs 抑制前列腺素合成，削弱 ACEI 的降压效果并减少肾血流灌注
  consequence: 血压控制变差；与利尿剂合用时构成"三重打击"，急性肾损伤风险显著升高
  suggestion: 避免长期联用；必须使用时监测血压、血肌酐与血钾
  evidence_level: B
  sources:
    - title: 卡托普利片说明书
      type: 说明书
      excerpt: 与 NSAIDs 合用可能减弱降压效果并增加肾功能损害风险。

- ing_a: 布洛芬
  ing_b: 依那普利
  severity: caution
  mechanism: 同 ACEI 类机制，NSAIDs 削弱降压并损害肾灌注
  consequence: 血压升高、急性肾损伤风险
  suggestion: 避免长期联用，监测肾功能
  evidence_level: B

- ing_a: 布洛芬
  ing_b: 氯沙坦钾
  severity: caution
  mechanism: NSAIDs 削弱 ARB 降压效果并减少肾灌注
  consequence: 血压控制变差、肾功能恶化
  suggestion: 避免长期联用，监测血压与血肌酐
  evidence_level: B

- ing_a: 布洛芬
