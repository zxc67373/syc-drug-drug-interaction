  mechanism: 同属非选择性 COX 抑制剂，疗效不叠加而毒性叠加
  consequence: 消化道溃疡/出血、急性肾损伤风险显著增加
  suggestion: 禁止联用，同类药物择一
  evidence_level: A
  sources:
    - title: 布洛芬缓释胶囊说明书
      type: 说明书
      excerpt: 不应与其他 NSAIDs 合用，以免增加胃肠道不良反应。

