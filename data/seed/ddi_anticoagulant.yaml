  consequence: 消化道出血风险升高
  suggestion: 避免长期联用
  evidence_level: B

# ── 抗血小板药之间 ───────────────────────────────────
- ing_a: 阿司匹林
  ing_b: 氯吡格雷
  severity: monitor
  mechanism: 双联抗血小板治疗（DAPT），作用于不同通路
  consequence: 出血风险增加，但在急性冠脉综合征/支架术后为必需治疗
  suggestion: 属常规治疗方案，需按指南限定疗程（通常 6–12 个月），并评估出血风险
  evidence_level: A

- ing_a: 阿司匹林
  ing_b: 替格瑞洛
  severity: monitor
  mechanism: 双联抗血小板治疗
  consequence: 出血风险增加，属预期治疗效应
  suggestion: 按指南使用，监测出血征象
  evidence_level: A

- ing_a: 氯吡格雷
  ing_b: 替格瑞洛
  severity: contraindicated
  mechanism: 两种 P2Y12 受体拮抗剂作用靶点相同，叠加无额外获益
  consequence: 出血风险显著增加而抗栓获益不增加
  suggestion: 禁止联用，二者择一
  evidence_level: A

- ing_a: 阿司匹林
  ing_b: 布洛芬
  severity: caution
  mechanism: 布洛芬竞争性占据血小板 COX-1 结合位点，削弱阿司匹林的不可逆抗血小板作用
  consequence: 阿司匹林心血管保护作用被削弱；同时消化道出血风险增加
  suggestion: 若必须使用，布洛芬应在阿司匹林后至少 2 小时服用，或改用对乙酰氨基酚
  evidence_level: B
  sources:
    - title: 布洛芬缓释胶囊说明书
      type: 说明书
      excerpt: 布洛芬可能干扰低剂量阿司匹林的抗血小板作用，合用时应注意服药间隔。

- ing_a: 替格瑞洛
  ing_b: 布洛芬
  severity: caution
  mechanism: 抗血小板作用叠加，NSAIDs 损伤胃黏膜
  consequence: 消化道出血风险升高
  suggestion: 避免长期联用，必要时加用 PPI
  evidence_level: B

- ing_a: 氯吡格雷
  ing_b: 奥美拉唑
  severity: caution
  mechanism: 奥美拉唑抑制 CYP2C19，阻碍氯吡格雷转化为活性代谢物
  consequence: 氯吡格雷抗血小板作用减弱，心血管事件风险可能升高
  suggestion: 改用对 CYP2C19 抑制较弱的泮托拉唑
  evidence_level: B
  sources:
    - title: 硫酸氢氯吡格雷片说明书
      type: 说明书
      excerpt: 不推荐与奥美拉唑等强效 CYP2C19 抑制剂合用，如需使用 PPI 建议选择泮托拉唑。

- ing_a: 氯吡格雷
  ing_b: 泮托拉唑
  severity: monitor
  mechanism: 泮托拉唑对 CYP2C19 抑制弱，相互作用较小
  consequence: 影响轻微
  suggestion: 需联用 PPI 时优先选择泮托拉唑
  evidence_level: B

- ing_a: 阿司匹林
  ing_b: 奥美拉唑
  severity: monitor
  mechanism: PPI 用于预防阿司匹林相关消化道损伤
  consequence: 属保护性联用
  suggestion: 有消化道溃疡史者建议联用 PPI 保护
  evidence_level: A
