# ── 抗精神病药 ───────────────────────────────────────
- ing_a: 奥氮平
  ing_b: 氟西汀
  severity: caution
  mechanism: 氟西汀抑制 CYP2D6 与 CYP1A2，升高奥氮平血药浓度；两者均延长 QT
  consequence: 奥氮平不良反应加重（镇静、体重增加、代谢异常），QT 延长
  suggestion: 联用时降低奥氮平剂量并监测
  evidence_level: B

- ing_a: 奥氮平
  ing_b: 氟康唑
  severity: caution
  mechanism: 氟康唑抑制 CYP1A2/CYP3A4，升高奥氮平浓度
  consequence: 奥氮平毒性增加
  suggestion: 联用时减量并监测
  evidence_level: C

- ing_a: 奥氮平
  ing_b: 氯氮平
  severity: caution
  mechanism: 两种抗精神病药叠加，且均降低癫痫阈值、影响代谢
  consequence: 镇静、代谢紊乱、粒细胞缺乏风险叠加
  suggestion: 避免联用；氯氮平本身需监测血常规
  evidence_level: B

- ing_a: 氯氮平
  ing_b: 卡马西平
  severity: contraindicated
  mechanism: 两者均可致粒细胞缺乏，且卡马西平诱导氯氮平代谢
  consequence: 粒细胞缺乏症风险显著增加（可致命）
  suggestion: 禁止联用；氯氮平使用者需定期监测血常规
  evidence_level: A
  sources:
    - title: 氯氮平片说明书
      type: 说明书
      excerpt: 不推荐与卡马西平合用，两者均可引起骨髓抑制，合用增加粒细胞缺乏风险。

- ing_a: 奥氮平
  ing_b: 卡马西平
  severity: caution
  mechanism: 卡马西平诱导 CYP3A4 与 CYP1A2，显著降低奥氮平血药浓度
  consequence: 奥氮平疗效下降
  suggestion: 联用时监测疗效，必要时调整剂量
  evidence_level: B

# ── 抗抑郁药换药 ─────────────────────────────────────
- ing_a: 帕罗西汀
  ing_b: 文拉法辛
  severity: caution
  mechanism: 两种抗抑郁药叠加增强 5-HT 能传导
  consequence: 5-HT 综合征
  suggestion: 换药须设洗脱期，避免叠加
  evidence_level: B

- ing_a: 美托洛尔
  ing_b: 舍曲林
  severity: monitor
  mechanism: 舍曲林对 CYP2D6 抑制弱于氟西汀/帕罗西汀
  consequence: 美托洛尔浓度轻度升高
  suggestion: 监测心率与血压
  evidence_level: C

# ── 抗癫痫药 ─────────────────────────────────────────
- ing_a: 丙戊酸钠
  ing_b: 奥氮平
  severity: caution
  mechanism: 丙戊酸钠抑制葡萄糖醛酸转移酶，可能升高奥氮平浓度；两者均致体重增加与代谢异常
  consequence: 代谢不良反应叠加
  suggestion: 监测体重、血糖与血脂
  evidence_level: C
