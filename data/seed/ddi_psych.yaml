# 精神/神经系统相互作用。⚠️ status=draft，excerpt 为要义转述。
# 本组规则以 5-HT 综合征、中枢抑制叠加、QT 延长为主。

# ── 5-HT 综合征 ──────────────────────────────────────
- ing_a: 舍曲林
  ing_b: 曲马多
  severity: contraindicated
  mechanism: 曲马多抑制 5-HT 再摄取，与 SSRI 协同升高突触间隙 5-HT；同时两者均降低癫痫阈值
  consequence: 5-HT 综合征（高热、肌阵挛、意识障碍、自主神经不稳），可致命；癫痫发作风险增加
  suggestion: 避免联用。确需镇痛时改用非 5-HT 能镇痛药（如对乙酰氨基酚、NSAIDs）
  evidence_level: A
  sources:
    - title: 盐酸曲马多缓释片说明书
      type: 说明书
      excerpt: 禁与 SSRI 类抗抑郁药合用，合用可致 5-HT 综合征与癫痫发作。

- ing_a: 氟西汀
  ing_b: 曲马多
  severity: contraindicated
  mechanism: 同 5-HT 能机制叠加；氟西汀还抑制 CYP2D6，减慢曲马多代谢
  consequence: 5-HT 综合征、癫痫
  suggestion: 禁止联用
  evidence_level: A

- ing_a: 帕罗西汀
  ing_b: 曲马多
  severity: contraindicated
  mechanism: 同 5-HT 能机制叠加
  consequence: 5-HT 综合征、癫痫
  suggestion: 禁止联用
  evidence_level: A

- ing_a: 文拉法辛
  ing_b: 曲马多
  severity: contraindicated
  mechanism: SNRI 与曲马多双重 5-HT/NE 再摄取抑制
  consequence: 5-HT 综合征风险高
  suggestion: 禁止联用
  evidence_level: A

- ing_a: 舍曲林
  ing_b: 文拉法辛
  severity: caution
  mechanism: 两种抗抑郁药均增强 5-HT 能传导
  consequence: 5-HT 综合征风险增加
  suggestion: 避免叠加使用；换药时须充分洗脱期
  evidence_level: B

- ing_a: 氟西汀
  ing_b: 文拉法辛
  severity: caution
  mechanism: 5-HT 能作用叠加
  consequence: 5-HT 综合征风险
  suggestion: 避免叠加，换药须洗脱
  evidence_level: B

- ing_a: 氟西汀
  ing_b: 帕罗西汀
  severity: contraindicated
  mechanism: 两种 SSRI 作用靶点相同，疗效不叠加而毒性叠加；氟西汀半衰期长，停药后仍长期抑制 CYP2D6
  consequence: 5-HT 综合征风险显著增加
  suggestion: 禁止联用，同类药物择一
  evidence_level: A
  sources:
    - title: 盐酸氟西汀胶囊说明书
      type: 说明书
      excerpt: 不推荐与其他 SSRI 合用，合用可增加 5-HT 综合征风险。

- ing_a: 舍曲林
  ing_b: 帕罗西汀
  severity: contraindicated
  mechanism: 两种 SSRI 叠加
  consequence: 5-HT 综合征
  suggestion: 禁止联用
  evidence_level: A

- ing_a: 舍曲林
  ing_b: 氟西汀
  severity: contraindicated
  mechanism: 两种 SSRI 叠加
  consequence: 5-HT 综合征
  suggestion: 禁止联用
  evidence_level: A

# ── 阿片类 × 苯二氮䓬类（呼吸抑制）──────────────────
- ing_a: 吗啡
  ing_b: 地西泮
  severity: contraindicated
  mechanism: 阿片类抑制脑干呼吸中枢，苯二氮䓬类增强 GABA 能中枢抑制，两者协同
  consequence: 严重呼吸抑制、深度镇静、昏迷乃至死亡（FDA 黑框警告）
  suggestion: 避免联用。确需联用时使用最低剂量、最短疗程，并考虑处方纳洛酮
  evidence_level: A
  sources:
    - title: 硫酸吗啡缓释片说明书
      type: 说明书
      excerpt: 与苯二氮䓬类或其他中枢抑制剂合用可致严重呼吸抑制、昏迷甚至死亡。

- ing_a: 吗啡
  ing_b: 阿普唑仑
  severity: contraindicated
  mechanism: 阿片类与苯二氮䓬类中枢抑制协同
  consequence: 严重呼吸抑制、死亡风险
  suggestion: 避免联用
  evidence_level: A

- ing_a: 吗啡
  ing_b: 艾司唑仑
  severity: contraindicated
  mechanism: 中枢抑制协同
  consequence: 呼吸抑制
  suggestion: 避免联用
  evidence_level: A

- ing_a: 吗啡
  ing_b: 唑吡坦
  severity: contraindicated
  mechanism: 镇静催眠药与阿片类中枢抑制协同
  consequence: 呼吸抑制、跌倒、认知障碍
  suggestion: 避免联用
  evidence_level: A

- ing_a: 可待因
  ing_b: 地西泮
  severity: contraindicated
  mechanism: 可待因在体内部分转化为吗啡，中枢抑制协同
  consequence: 呼吸抑制
  suggestion: 避免联用
  evidence_level: A

- ing_a: 曲马多
  ing_b: 地西泮
  severity: contraindicated
  mechanism: 曲马多中枢抑制作用与苯二氮䓬类叠加
  consequence: 呼吸抑制、过度镇静
  suggestion: 避免联用
  evidence_level: A

- ing_a: 可待因
  ing_b: 阿普唑仑
  severity: contraindicated
  mechanism: 中枢抑制协同
  consequence: 呼吸抑制
  suggestion: 避免联用
  evidence_level: A

- ing_a: 曲马多
  ing_b: 阿普唑仑
  severity: contraindicated
  mechanism: 中枢抑制协同
  consequence: 呼吸抑制
  suggestion: 避免联用
  evidence_level: A

- ing_a: 吗啡
  ing_b: 可待因
  severity: caution
  mechanism: 两种阿片类叠加，中枢抑制与便秘等不良反应加重
  consequence: 呼吸抑制、过度镇静
  suggestion: 避免叠加使用
  evidence_level: B

